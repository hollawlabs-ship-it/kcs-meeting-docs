# Render.com 블루프린트 — 저장소를 연결하면 이 파일대로 서비스가 만들어집니다.
# https://render.com/deploy?repo=<이 저장소 URL>
services:
  - type: web
    name: meeting-docs
    runtime: docker
    plan: starter          # 디스크(영구 저장)는 유료 플랜에서만 지원. free 로 바꾸면 재배포 시 데이터가 사라짐
    region: singapore
    healthCheckPath: /healthz
    envVars:
      - key: MEETING_DOCS_SECRET
        generateValue: true
      - key: MEETING_DOCS_ADMIN_PASSWORD
        sync: false          # 배포 시 직접 입력 (최초 관리자 비밀번호)
      - key: MEETING_DOCS_DATA
        value: /data
      - key: PORT
        value: "8766"
    disk:
      name: meeting-docs-data
      mountPath: /data
      sizeGB: 1
