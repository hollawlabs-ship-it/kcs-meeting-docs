{% extends "base.html" %}
{% block title %}시작{% endblock %}
{% block content %}
<div class="hero">
  <img src="/static/img/logo_ksjcs.png" alt="{{ settings.society_name }}" class="hero-logo">
  <h1>제{{ settings.term }}대 연구회 운영위원회</h1>
  <p class="lead">연구회별로 활동 내역과 계획을 입력하면 사무국이 취합하여 회의자료(PDF)를 자동으로 만듭니다.</p>
  <div class="hero-actions">
    <a class="btn btn-primary btn-lg" href="/g/login">연구회 활동보고 입력</a>
    <a class="btn btn-lg" href="/login">관리자(사무국) 로그인</a>
  </div>
</div>
{% endblock %}
